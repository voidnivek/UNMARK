<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMARK — Free Watermark-Free Video Downloader</title>
    <meta name="description" content="UNMARK lets you download TikTok, Instagram, YouTube, and Snapchat videos fast and without watermarks.">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            margin: 0;
        }
        .brand-header {
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .logo {
            font-size: 2.25rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .tagline {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 0.35rem;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
        }
        .platforms {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }
        .badge {
            background: #1e293b;
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            border: 1px solid #334155;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin: 1.25rem 0;
        }
        input {
            flex: 1;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #090d16;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #334155; cursor: not-allowed; opacity: 0.7; }
        .ad-slot {
            margin: 1.25rem 0;
            padding: 1rem;
            background: #090d16;
            border: 1px dashed #334155;
            border-radius: 10px;
            color: #64748b;
            font-size: 0.8rem;
        }
        #result {
            margin-top: 1.5rem;
            display: none;
            background: #090d16;
            border: 1px solid #1f2937;
            padding: 1.25rem;
            border-radius: 12px;
        }
        #result img {
            max-width: 100%;
            border-radius: 8px;
            max-height: 260px;
            object-fit: cover;
        }
        #videoTitle {
            font-size: 1rem;
            margin: 1rem 0;
            color: #e2e8f0;
        }
        .download-btn {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #059669; }
        .error { color: #f87171; margin-top: 1rem; font-size: 0.9rem; }
        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #475569;
            font-size: 0.8rem;
            text-align: center;
        }
        @media (max-width: 480px) {
            .input-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
    <!-- PASTE YOUR POP-UNDER AD SCRIPT HERE -->
</head>
<body>

<div class="brand-header">
    <h1 class="logo">UNMARK</h1>
    <p class="tagline">Save social videos clean &amp; watermark-free</p>
</div>

<div class="container">
    <div class="platforms">
        <span class="badge">TikTok</span>
        <span class="badge">Instagram</span>
        <span class="badge">YouTube</span>
        <span class="badge">Snapchat</span>
    </div>

    <!-- TOP BANNER AD SLOT -->
    <div class="ad-slot">
        <!-- Paste Top Banner Ad Code Here -->
        Ad Space (728x90 / Responsive)
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Paste link from TikTok, IG, YT, or Snap..." required>
        <button id="fetchBtn" onclick="fetchVideo()">Unmark</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="result">
        <img id="thumb" src="" alt="Video Thumbnail">
        <h3 id="videoTitle"></h3>
        <a id="downloadLink" class="download-btn" href="#" target="_blank" rel="noopener noreferrer">Download MP4</a>
    </div>

    <!-- BOTTOM BANNER AD SLOT -->
    <div class="ad-slot">
        <!-- Paste Bottom Banner Ad Code Here -->
        Ad Space (300x250 / Responsive)
    </div>
</div>

<footer>
    &copy; 2026 UNMARK. For personal use only.
</footer>

<script>
    async function fetchVideo() {
        const urlInput = document.getElementById('videoUrl').value;
        const btn = document.getElementById('fetchBtn');
        const errorMsg = document.getElementById('errorMsg');
        const resultDiv = document.getElementById('result');

        errorMsg.textContent = '';
        resultDiv.style.display = 'none';

        if (!urlInput) {
            errorMsg.textContent = 'Please paste a video link first.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Processing...';

        try {
            const response = await fetch('/api/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || 'Could not extract video.');
            }

            document.getElementById('thumb').src = data.thumbnail || '';
            document.getElementById('videoTitle').textContent = data.title;
            document.getElementById('downloadLink').href = data.download_url;
            resultDiv.style.display = 'block';
        } catch (err) {
            errorMsg.textContent = err.message;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Unmark';
        }
    }
</script>

</body>
</html>
